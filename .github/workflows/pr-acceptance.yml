name: PR Acceptance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Prettier Check
        run: npx prettier --check . --ignore-unknown

      - name: Typecheck
        run: npx tsc --noEmit

      # Drives the whole pipeline against the mock engine in src/fixtures —
      # no GPU, no network, no engine required.
      - name: Test
        run: npm test
