name: PR Acceptance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Prettier Check
        run: bun run prettier --check . --ignore-unknown

      - name: Typecheck
        run: bun x tsc --noEmit

      # Drives the whole pipeline against the mock engine in src/fixtures —
      # no GPU, no network, no engine required.
      - name: Test
        run: bun test
