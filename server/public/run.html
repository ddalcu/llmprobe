<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>llmprobe run</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <p><a href="/">&larr; all runs</a></p>
    <div id="out"></div>

    <script type="module">
      import { bars, lines } from "/chart.js";

      const key = new URLSearchParams(location.search).get("key");
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const num = (v, unit = "", dp = 0) =>
        typeof v === "number" ? `${v.toFixed(dp)}${unit}` : "—";
      const stat = (label, value, sub) =>
        `<div class="stat"><b>${value}</b><span>${esc(label)}${sub ? ` · ${esc(sub)}` : ""}</span></div>`;
      const range = (s) =>
        s && typeof s.min === "number" ? `${s.min}–${s.max}` : "";
      const section = (title, body) =>
        body ? `<h2>${esc(title)}</h2>${body}` : "";

      const ran = (phase) => phase?.status === "measured";
      const samplesRow = (label, unit, values, dp, median, k) =>
        `<tr><td>${esc(label)}</td>${Array.from({ length: k }, (_, i) => `<td class="num">${num(values[i], "", dp)}</td>`).join("")}<td class="num"><b>${num(median, "", dp)}</b></td><td class="dim">${unit}</td></tr>`;

      function render(d) {
        const b = d.bench ?? {};
        const scaling = b.contextScaling ?? [];
        const pick = (f, sub) =>
          scaling
            .filter((p) => typeof (sub ? p[sub]?.[f] : p[f]) === "number")
            .map((p) => [p.inputTokens, sub ? p[sub][f] : p[f]]);
        const chart = (title, yLabel, series) =>
          lines(series, { xLabel: "context (tokens)", yLabel, title });

        const k = Math.max(
          ...["decodeTokPerSec", "prefillTokPerSec", "ttftMs"].map(
            (f) => b[f]?.samples?.length ?? 0,
          ),
          0,
        );
        const sampleRows = [
          ["decode", "tok/s", b.decodeTokPerSec, 1],
          ["prefill", "tok/s", b.prefillTokPerSec, 0],
          ["TTFT", "ms", b.ttftMs, 0],
        ]
          .filter(([, , s]) => s?.samples?.length)
          .map(([label, unit, s, dp]) =>
            samplesRow(label, unit, s.samples, dp, s.median, k),
          )
          .concat(
            b.speculative
              ? [
                  samplesRow("spec:predictable", "tok/s", [], 1, b.speculative.predictableTokPerSec, k),
                  samplesRow("spec:novel", "tok/s", [], 1, b.speculative.novelTokPerSec, k),
                ]
              : [],
          );

        const failures = (d.conformance?.results ?? []).filter(
          (r) => r.outcome === "fail",
        );
        const notes = [
          b.streamCaveat,
          b.decodeLengthNote,
          b.samplingNote,
          b.runsNote,
          b.reasoningNote,
        ]
          .filter(Boolean)
          .concat(d.incomplete ? [`Run did not finish: ${d.incomplete}`] : []);

        return `
        <h1>${esc(d.target?.model ?? "unknown")} ${d.run?.label ? `<span class="dim">${esc(d.run.label)}</span>` : ""}</h1>
        <div class="sub">
          ${esc(d.target?.engine ?? "engine unknown")} · ${esc(d.target?.baseUrl ?? "")}<br />
          ${esc([b.machine?.cpu ?? d.machine?.cpu, `${d.machine?.memGB ?? b.machine?.memGB}GB`, `${d.machine?.platform}/${d.machine?.arch}`].join(" · "))}<br />
          ${esc(d.run?.startedAt ?? "")} · ${esc(d.run?.depth ?? "")} ${esc(d.run?.mode ?? "")} ·
          ${num(d.durationMs / 1000, "s", 0)} · ${(d.usage?.inputTokens ?? 0) + (d.usage?.outputTokens ?? 0)} tokens
        </div>

        <div class="stats">
          ${ran(d.run?.phases?.conformance) ? stat("conformance", num(d.conformance?.pct, "%"), `${d.conformance?.passed}/${d.conformance?.total} MUSTs`) : ""}
          ${ran(d.run?.phases?.capability) ? stat("capability", num(d.capability?.pct, "%"), d.capability?.verdict) : ""}
          ${stat("decode", num(b.decodeTokPerSec?.median, " t/s", 1), range(b.decodeTokPerSec))}
          ${stat("prefill", num(b.prefillTokPerSec?.median, " t/s"), range(b.prefillTokPerSec))}
          ${stat("TTFT", num(b.ttftMs?.median, " ms"), range(b.ttftMs))}
        </div>

        ${section(
          "Coverage by tier",
          bars(
            (d.coverage?.byTier ?? []).map((t) => ({
              label: t.tier,
              pct: t.pct,
              note: t.missing?.length ? `missing: ${t.missing.join(", ")}` : "",
            })),
          ),
        )}

        ${section(
          "Conformance by surface",
          bars(
            (d.conformance?.bySurface ?? []).map((s) => ({
              label: s.surface,
              pct: s.pct,
              note: `${s.passed}/${s.total}`,
            })),
          ),
        )}

        ${section(
          "Capability by category",
          bars(
            (d.capability?.categories ?? []).map((c) => ({
              label: c.category ?? c.name,
              pct: c.pct,
              note: `${c.passed ?? ""}${c.total ? `/${c.total}` : ""}`,
            })),
          ),
        )}

        ${section(
          "Runs",
          sampleRows.length
            ? `<table class="samples"><thead><tr><th></th>${Array.from({ length: k }, (_, i) => `<th class="num">${i + 1}/${k}</th>`).join("")}<th class="num">median</th><th></th></tr></thead><tbody>${sampleRows.join("")}</tbody></table>`
            : "",
        )}

        ${section(
          "Context scaling",
          scaling.length > 1
            ? `<div class="charts">
              ${chart("Prefill", "prompt tok/s", [{ label: "prefill", points: pick("prefillTokPerSec") }])}
              ${chart("Decode", "tok/s", [
                { label: "decode (coding)", points: pick("decodeTokPerSec") },
                { label: "predictable (spec ceiling)", points: pick("predictableTokPerSec", "speculative") },
              ])}
              ${chart("Time to first token", "ms", [{ label: "TTFT", points: pick("ttftMs") }])}
            </div>`
            : "",
        )}

        ${section(
          "Engine behaviour",
          b.batching || b.prefixCache || b.speculative || b.loadDrift
            ? `<div class="stats">
              ${b.batching ? stat(`batching (${b.batching.streams} streams)`, esc(b.batching.verdict), `${num(b.batching.efficiency, "", 2)} efficiency`) : ""}
              ${b.prefixCache ? stat("prefix cache", esc(b.prefixCache.verdict), b.prefixCache.speedup ? `${num(b.prefixCache.speedup, "×", 1)}` : "") : ""}
              ${b.speculative ? stat("speculative", esc(b.speculative.verdict ?? "—"), b.speculative.ratio ? `${num(b.speculative.ratio, "×", 2)}` : "") : ""}
              ${b.loadDrift ? stat("load drift", esc(b.loadDrift.verdict), b.loadDrift.driftPct != null ? `${num(b.loadDrift.driftPct, "%", 1)}` : "") : ""}
            </div>`
            : "",
        )}

        ${section(
          `Failing checks (${failures.length})`,
          failures.length
            ? `<table><tbody>${failures
                .map(
                  (f) =>
                    `<tr><td>${esc(f.surface)}</td><td>${esc(f.name ?? f.id)}</td><td class="dim">${esc(f.failures?.[0]?.message ?? "")}</td></tr>`,
                )
                .join("")}</tbody></table>`
            : "",
        )}

        ${notes.length ? `<div class="note">${notes.map(esc).join("<br />")}</div>` : ""}
        <p class="note"><a href="/api/runs/${encodeURIComponent(key)}">raw json</a></p>`;
      }

      const res = await fetch(`/api/runs/${encodeURIComponent(key)}`);
      document.getElementById("out").innerHTML = res.ok
        ? render(await res.json())
        : `<p class="empty">No run for that key.</p>`;
    </script>
  </body>
</html>
