<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>llmprobe runs</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <h1>llmprobe runs</h1>
    <div class="filters">
      <select id="model"></select>
      <select id="hardware"></select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Model</th>
          <th>Engine</th>
          <th>Hardware</th>
          <th>Label</th>
          <th>Cov</th>
          <th>Conf</th>
          <th>Cap</th>
          <th>Decode</th>
          <th>Prefill</th>
          <th>TTFT</th>
          <th>When</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No runs.</div>

    <script>
      const $ = (id) => document.getElementById(id);
      const num = (v, unit) => (v === null ? "—" : `${v}${unit}`);

      function fill(select, label, values, keep) {
        select.innerHTML =
          `<option value="">${label}</option>` +
          values.map((v) => `<option>${v}</option>`).join("");
        if (values.includes(keep)) select.value = keep;
      }

      async function load() {
        const q = new URLSearchParams();
        if ($("model").value) q.set("model", $("model").value);
        if ($("hardware").value) q.set("hardware", $("hardware").value);
        const runs = await (await fetch(`/api/runs?${q}`)).json();
        $("empty").hidden = runs.length > 0;
        $("rows").innerHTML = runs
          .map(
            (r) => `<tr>
              <td><a href="/run.html?key=${encodeURIComponent(r.key)}">${r.model}</a></td>
              <td>${r.engine ?? "—"}</td>
              <td>${r.hardware}</td>
              <td>${r.label ?? "—"}</td>
              <td class="num">${num(r.coverage, "%")}</td>
              <td class="num">${num(r.conformance, "%")}</td>
              <td class="num">${num(r.capability, "%")}</td>
              <td class="num">${num(r.decodeTokPerSec, " t/s")}</td>
              <td class="num">${num(r.prefillTokPerSec, " t/s")}</td>
              <td class="num">${num(r.ttftMs, " ms")}</td>
              <td>${r.startedAt ? r.startedAt.slice(0, 16).replace("T", " ") : "—"}</td>
            </tr>`,
          )
          .join("");
      }

      async function refresh() {
        const f = await (await fetch("/api/facets")).json();
        fill($("model"), "All models", f.models, $("model").value);
        fill($("hardware"), "All hardware", f.hardware, $("hardware").value);
        await load();
      }

      $("model").onchange = load;
      $("hardware").onchange = load;
      refresh();
    </script>
  </body>
</html>
